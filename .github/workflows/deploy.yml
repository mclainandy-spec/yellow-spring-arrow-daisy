name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main # Change this if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Adjust version based on your Grok app needs
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Build Grok application
        run: npm run build # Adjust if your Grok app uses a custom build script

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy.vercel/output/static --project-name=yellow-spring-arrow-daisy
